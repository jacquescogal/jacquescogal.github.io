  <!--
    ── DIRECTION CONTRACT ── The Esper Console ────────────────────────────

    THESIS: A portfolio built as a forensic analysis terminal, because the one
    thing this site does that no other portfolio does is retrieve evidence and
    show the route it took to reach it. Load a source, navigate it, pull the
    exact citation. It refuses the category default it replaced: slate ground,
    white cards in a grid, eyebrow-title-description sections, emerald accent,
    blurred sticky header. It equally refuses the generic cyberpunk default of
    near-black plus one neon accent with glowing edges.

    OWN-WORLD: Blade Runner's 1982 material range, not its imitations. Warm
    tungsten near-black as the ground; sodium-amber phosphor as the only signal
    colour; cold slat light as temperature counterpoint; brass, steel, blood
    red for alerts. Hard venetian-blind light bands, atmospheric haze, CRT
    scanline pitch, analysis grids, and reticle brackets instead of borders.
    2px corners. Martian Mono carries display, labels, and data; Archivo
    carries anything read at length. Six signal channels drawn from the same
    palette, and amber is deliberately never spent on a module.

    STORY: A visiting engineer meets a portrait loaded into the analyser under
    a scan sweep, a live readout of real feed diagnostics, and a graph of every
    module. They interrogate Jacques AI, watch the amber route get drawn across
    the bus to the cited node, and land on a README in the analysis view.

    FIRST VIEWPORT: Slat-lit console header with the role at console scale and
    the primary actuator in amber. Beneath it, split: subject file with the
    reticle-bracketed portrait left, feed diagnostics right. Below, full width,
    the module graph on an analysis grid. Assistant docked as the engine.

    FORM: Esper forensic console — user-pinned world (Blade Runner), staged as
    a module bus read top to bottom, one node per section. A user pin beats the
    roll: this supersedes the transit direction dealt by seed key 08275b7e,
    which the user rejected on theming after two re-rolls (3cc674b4, c6d23eb3). User-pinned: portrait first-class in
    the first viewport, retrieval trace as the signature interaction, graph
    navigation preserved, fully dark reading surfaces.
  -->
